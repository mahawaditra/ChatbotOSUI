<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Chatbot AD/ART & SOP OSUI Mahawaditra — Tanyakan pertanyaan seputar aturan dan prosedur organisasi." />
  <title>Chatbot OSUI Mahawaditra</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <!-- Marked.js untuk render markdown -->
  <script src="https://cdn.jsdelivr.net/npm/marked@9/marked.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --primary:       #111111;
      --primary-hover: #333333;
      --surface:       #ffffff;
      --surface-2:     #f7f7f7;
      --border:        #e0e0e0;
      --text:          #111111;
      --text-muted:    #666666;
      --bubble-user:   #111111;
      --bubble-bot:    #f2f2f2;
      --accent:        #444444;
      --radius:        12px;
      --shadow:        0 1px 3px rgba(0,0,0,.08), 0 4px 16px rgba(0,0,0,.06);
    }

    html, body {
      height: 100%;
      font-family: 'Inter', sans-serif;
      background: var(--surface-2);
      color: var(--text);
    }

    /* ── Layout ── */
    .app {
      display: flex;
      flex-direction: column;
      height: 100dvh;
      max-width: 780px;
      margin: 0 auto;
      background: var(--surface);
      box-shadow: var(--shadow);
    }

    /* ── Header ── */
    .header {
      padding: 16px 20px;
      background: var(--primary);
      color: #fff;
      display: flex;
      align-items: center;
      gap: 12px;
      flex-shrink: 0;
      border-bottom: 2px solid #000;
    }
    .header-icon {
      width: 40px; height: 40px;
      border-radius: 10px;
      overflow: hidden;
      flex-shrink: 0;
      border: 1px solid rgba(255,255,255,.25);
    }
    .header-icon img { width: 100%; height: 100%; object-fit: contain; background: #fff; }
    .header-title { font-size: 1rem; font-weight: 700; line-height: 1.3; }
    .header-subtitle { font-size: .78rem; opacity: .65; margin-top: 2px; }
    .status-dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: #ffffff;
      margin-left: auto;
      flex-shrink: 0;
      opacity: .9;
      animation: pulse 2.5s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: .9; transform: scale(1); }
      50%       { opacity: .5; transform: scale(1.2); }
    }

    /* ── Chat area ── */
    .chat-area {
      flex: 1;
      overflow-y: auto;
      padding: 20px 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      scroll-behavior: smooth;
    }

    /* ── Welcome ── */
    .welcome {
      text-align: center;
      padding: 32px 16px;
      color: var(--text-muted);
    }
    .welcome-icon { font-size: 48px; margin-bottom: 12px; }
    .welcome h2 { font-size: 1.1rem; font-weight: 700; color: var(--text); margin-bottom: 8px; }
    .welcome p { font-size: .875rem; line-height: 1.6; }
    .suggestion-chips {
      display: flex; flex-wrap: wrap; gap: 8px;
      justify-content: center;
      margin-top: 16px;
    }
    .chip {
      padding: 8px 14px;
      background: var(--surface);
      color: var(--text);
      border: 1.5px solid var(--border);
      border-radius: 999px;
      font-size: .8rem;
      font-weight: 500;
      cursor: pointer;
      transition: background .15s, border-color .15s, transform .1s;
      white-space: nowrap;
    }
    .chip:hover {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
      transform: translateY(-1px);
    }

    /* ── Bubbles ── */
    .message { display: flex; gap: 10px; max-width: 100%; }
    .message.user { flex-direction: row-reverse; }

    .avatar {
      width: 32px; height: 32px; border-radius: 50%;
      overflow: hidden;
      flex-shrink: 0;
      margin-top: 2px;
      border: 1.5px solid var(--border);
      background: #fff;
    }
    .message.user .avatar { border-color: var(--primary); }
    .avatar img { width: 100%; height: 100%; object-fit: contain; }

    .bubble {
      max-width: calc(100% - 50px);
      padding: 12px 16px;
      border-radius: var(--radius);
      font-size: .9rem;
      line-height: 1.7;
      word-break: break-word;
      border: 1px solid transparent;
    }
    .message.user .bubble {
      background: var(--bubble-user);
      color: #fff;
      border-color: #000;
      border-bottom-right-radius: 4px;
    }
    .message.bot .bubble {
      background: var(--bubble-bot);
      color: var(--text);
      border-color: var(--border);
      border-bottom-left-radius: 4px;
    }
    .message.bot.error .bubble {
      background: #fafafa;
      border-color: #ccc;
      color: #555;
    }

    /* Markdown dalam bubble bot */
    .bubble-content p  { margin-bottom: .6em; }
    .bubble-content p:last-child { margin-bottom: 0; }
    .bubble-content ul,
    .bubble-content ol { padding-left: 1.4em; margin-bottom: .6em; }
    .bubble-content li { margin-bottom: .25em; }
    .bubble-content strong { font-weight: 700; }
    .bubble-content em { font-style: italic; }
    .bubble-content code {
      background: rgba(0,0,0,.06);
      padding: 1px 5px;
      border-radius: 4px;
      font-size: .85em;
      font-family: monospace;
    }

    /* Sources */
    .sources {
      margin-top: 10px;
      padding: 8px 10px;
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: .78rem;
      color: var(--text-muted);
    }
    .sources-label { font-weight: 600; color: var(--text); margin-bottom: 4px; font-size: .8rem; }
    .source-item { display: flex; align-items: center; gap: 6px; padding: 2px 0; }
    .source-item::before { content: '📄'; font-size: 11px; }

    /* Loading */
    .loading-dots {
      display: flex; align-items: center; gap: 5px;
      padding: 4px 0;
    }
    .dot {
      width: 7px; height: 7px; border-radius: 50%;
      background: var(--text-muted);
      animation: bounce .9s infinite ease-in-out;
    }
    .dot:nth-child(2) { animation-delay: .15s; }
    .dot:nth-child(3) { animation-delay: .3s; }
    @keyframes bounce {
      0%, 80%, 100% { transform: translateY(0); opacity: .35; }
      40%            { transform: translateY(-6px); opacity: 1; }
    }

    /* Timeout */
    .timeout-warning {
      font-size: .8rem;
      color: #555;
      background: #f5f5f5;
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 8px 12px;
      margin-top: 8px;
      display: none;
    }

    /* ── Input area ── */
    .input-area {
      padding: 12px 16px 16px;
      border-top: 1.5px solid var(--border);
      background: var(--surface);
      flex-shrink: 0;
    }
    .input-row {
      display: flex;
      gap: 10px;
      align-items: flex-end;
    }
    #questionInput {
      flex: 1;
      padding: 12px 14px;
      border: 1.5px solid var(--border);
      border-radius: var(--radius);
      font-family: inherit;
      font-size: .9rem;
      resize: none;
      min-height: 48px;
      max-height: 140px;
      outline: none;
      transition: border-color .2s;
      line-height: 1.5;
      color: var(--text);
      background: var(--surface);
    }
    #questionInput:focus { border-color: var(--primary); }
    #questionInput::placeholder { color: #aaa; }
    #questionInput:disabled { background: var(--surface-2); cursor: not-allowed; }

    #sendBtn {
      width: 48px; height: 48px;
      border: 1.5px solid var(--primary);
      background: var(--primary);
      color: #fff;
      border-radius: var(--radius);
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      font-size: 18px;
      transition: background .2s, transform .1s;
      flex-shrink: 0;
    }
    #sendBtn:hover:not(:disabled) { background: var(--primary-hover); transform: scale(1.04); }
    #sendBtn:disabled { background: #ccc; border-color: #ccc; cursor: not-allowed; transform: none; }

    .input-hint {
      font-size: .72rem;
      color: #aaa;
      margin-top: 6px;
      display: flex;
      justify-content: space-between;
    }
    #charCount { color: #bbb; }
    #charCount.warn { color: #e07b00; }
    #charCount.over { color: #c00; font-weight: 600; }

    /* ── Responsive ── */
    @media (max-width: 600px) {
      .app { max-width: 100%; box-shadow: none; }
      .header { padding: 14px 16px; }
      .bubble { font-size: .875rem; }
    }
  </style>
</head>
<body>
  <div class="app">

    <header class="header">
      <div class="header-icon">
        <img src="/Logo.png" alt="Logo OSUI Mahawaditra" />
      </div>
      <div>
        <div class="header-title">Chatbot OSUI Mahawaditra</div>
        <div class="header-subtitle">Asisten AD/ART &amp; SOP Organisasi</div>
      </div>
      <div class="status-dot" title="Online"></div>
    </header>

    <main class="chat-area" id="chatArea" role="log" aria-live="polite" aria-label="Percakapan">
      <div class="welcome" id="welcomeMsg">
        <div class="welcome-icon">📋</div>
        <h2>Halo, Mahawaditra! 👋</h2>
        <p>Tanyakan apa saja seputar AD/ART atau SOP divisi organisasi kita.</p>
        <div class="suggestion-chips">
          <button class="chip" onclick="sendSuggestion(this)">Berapa masa jabatan ketua?</button>
          <button class="chip" onclick="sendSuggestion(this)">Apa syarat menjadi anggota aktif?</button>
          <button class="chip" onclick="sendSuggestion(this)">Bagaimana prosedur pengajuan dana?</button>
          <button class="chip" onclick="sendSuggestion(this)">Apa tugas divisi PSDM?</button>
        </div>
      </div>
    </main>

    <footer class="input-area">
      <div class="input-row">
        <textarea
          id="questionInput"
          placeholder="Ketik pertanyaan tentang AD/ART atau SOP..."
          rows="1"
          aria-label="Pertanyaan"
        ></textarea>
        <button id="sendBtn" onclick="sendMessage()" aria-label="Kirim pertanyaan">
          ➤
        </button>
      </div>
      <p class="input-hint">
        <span>Enter untuk kirim &middot; Shift+Enter baris baru</span>
        <span id="charCount">0 / 500</span>
      </p>
    </footer>

  </div>

  <script>
    // Konfigurasi marked.js
    marked.setOptions({ breaks: true, gfm: true });

    const chatArea    = document.getElementById('chatArea');
    const inputEl     = document.getElementById('questionInput');
    const sendBtn     = document.getElementById('sendBtn');
    const welcomeMsg  = document.getElementById('welcomeMsg');
    const charCount   = document.getElementById('charCount');
    const TIMEOUT_MS  = 30_000;
    const MAX_HISTORY = 3;
    const MAX_CHARS   = 500;

    // Riwayat percakapan [{role: "user"|"bot", content: "..."}]
    let conversationHistory = [];

    // Auto-resize textarea + char counter
    inputEl.addEventListener('input', () => {
      inputEl.style.height = 'auto';
      inputEl.style.height = Math.min(inputEl.scrollHeight, 140) + 'px';
      const len = inputEl.value.length;
      charCount.textContent = `${len} / ${MAX_CHARS}`;
      charCount.className = len > MAX_CHARS ? 'over' : len > MAX_CHARS * 0.8 ? 'warn' : '';
      sendBtn.disabled = len > MAX_CHARS;
    });

    inputEl.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });

    function sendSuggestion(btn) {
      inputEl.value = btn.textContent;
      sendMessage();
    }

    function setLoading(isLoading) {
      inputEl.disabled = isLoading;
      sendBtn.disabled = isLoading;
    }

    function scrollToBottom() {
      chatArea.scrollTo({ top: chatArea.scrollHeight, behavior: 'smooth' });
    }

    function removeWelcome() {
      if (welcomeMsg && welcomeMsg.parentNode) welcomeMsg.remove();
    }

    function appendMessage(role, contentText, sources = [], isMarkdown = false) {
      removeWelcome();

      const wrap = document.createElement('div');
      wrap.className = `message ${role}`;
      if (role === 'bot' && contentText.startsWith('\u26a0\ufe0f')) wrap.classList.add('error');

      const avatar = document.createElement('div');
      avatar.className = 'avatar';
      if (role === 'bot') {
        const avatarImg = document.createElement('img');
        avatarImg.src = '/Logo.png';
        avatarImg.alt = 'Bot OSUI';
        avatar.appendChild(avatarImg);
      } else {
        avatar.textContent = '👤';
        avatar.style.cssText = 'background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;font-size:14px;';
      }

      const bubble = document.createElement('div');
      bubble.className = 'bubble';

      const inner = document.createElement('div');
      inner.className = 'bubble-content';

      if (isMarkdown && role === 'bot') {
        // Render markdown untuk pesan bot
        inner.innerHTML = marked.parse(contentText);
      } else {
        inner.textContent = contentText;
      }
      bubble.appendChild(inner);

      // Sumber dokumen
      if (sources.length > 0) {
        const srcDiv = document.createElement('div');
        srcDiv.className = 'sources';
        srcDiv.innerHTML = `<div class="sources-label">📚 Sumber Dokumen</div>`;
        sources.forEach(s => {
          const item = document.createElement('div');
          item.className = 'source-item';
          item.textContent = `${s.file} — Halaman ${s.page}`;
          srcDiv.appendChild(item);
        });
        bubble.appendChild(srcDiv);
      }

      wrap.appendChild(avatar);
      wrap.appendChild(bubble);
      chatArea.appendChild(wrap);
      scrollToBottom();
      return wrap;
    }

    function appendLoading() {
      removeWelcome();
      const wrap = document.createElement('div');
      wrap.className = 'message bot';
      wrap.id = 'loadingMsg';

      const avatar = document.createElement('div');
      avatar.className = 'avatar';
      const avatarImg = document.createElement('img');
      avatarImg.src = '/Logo.png';
      avatarImg.alt = 'Bot OSUI';
      avatar.appendChild(avatarImg);

      const bubble = document.createElement('div');
      bubble.className = 'bubble';

      const dots = document.createElement('div');
      dots.className = 'loading-dots';
      dots.innerHTML = '<div class="dot"></div><div class="dot"></div><div class="dot"></div>';

      const warning = document.createElement('div');
      warning.className = 'timeout-warning';
      warning.id = 'timeoutWarning';
      warning.textContent = '⏳ Permintaan memakan waktu lebih lama. Silakan tunggu atau coba lagi.';

      bubble.appendChild(dots);
      bubble.appendChild(warning);
      wrap.appendChild(avatar);
      wrap.appendChild(bubble);
      chatArea.appendChild(wrap);
      scrollToBottom();
    }

    function removeLoading() {
      const el = document.getElementById('loadingMsg');
      if (el) el.remove();
    }

    async function sendMessage() {
      const question = inputEl.value.trim();
      if (!question) return;

      appendMessage('user', question, [], false);
      inputEl.value = '';
      inputEl.style.height = 'auto';

      setLoading(true);
      appendLoading();

      const timeoutId = setTimeout(() => {
        const w = document.getElementById('timeoutWarning');
        if (w) w.style.display = 'block';
        scrollToBottom();
      }, TIMEOUT_MS);

      // Kirim riwayat 3 chat terakhir (MAX_HISTORY pasang = MAX_HISTORY*2 messages)
      const historyToSend = conversationHistory.slice(-(MAX_HISTORY * 2));

      try {
        const controller = new AbortController();
        const hardTimeout = setTimeout(() => controller.abort(), 60_000);

        const res = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message: question, history: historyToSend }),
          signal: controller.signal,
        });

        clearTimeout(hardTimeout);
        clearTimeout(timeoutId);
        removeLoading();

        const data = await res.json();

        if (!res.ok || !data.answer) {
          appendMessage('bot', '⚠️ ' + (data.answer || 'Terjadi kesalahan. Silakan coba lagi.'), [], false);
        } else {
          appendMessage('bot', data.answer, data.sources || [], true);

          // Simpan ke riwayat percakapan
          conversationHistory.push({ role: 'user', content: question });
          conversationHistory.push({ role: 'bot', content: data.answer });

          // Batasi riwayat agar tidak terlalu panjang (simpan MAX_HISTORY*2 messages)
          if (conversationHistory.length > MAX_HISTORY * 2 * 2) {
            conversationHistory = conversationHistory.slice(-(MAX_HISTORY * 2));
          }
        }

      } catch (err) {
        clearTimeout(timeoutId);
        removeLoading();
        if (err.name === 'AbortError') {
          appendMessage('bot', '⚠️ Permintaan habis waktu. Silakan coba lagi.', [], false);
        } else {
          appendMessage('bot', '⚠️ Tidak dapat terhubung ke server. Periksa koneksi internet Anda.', [], false);
        }
      } finally {
        setLoading(false);
        inputEl.focus();
      }
    }
  </script>
</body>
</html>
